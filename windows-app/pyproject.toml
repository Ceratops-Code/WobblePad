[project]
name = "wobblepad-windows"
version = "0.1.0"
description = "Unofficial Windows controller bridge for compatible balance boards"
requires-python = ">=3.11"
dependencies = ["bleak==3.0.2"]

[project.gui-scripts]
wobblepad = "wobblepad_windows.app:main"

[dependency-groups]
dev = ["pyinstaller==6.22.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wobblepad_windows"]
