version: 3
kind: ceratops-sdlc
repository:
  prerequisites:
    python:
      executable: python
    uv:
      executable: uv
  bootstrap:
    validation:
      prerequisites:
        - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
  validate:
    repository:
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/validate-repository.py
    android:
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/repository_checks.py
            - validate
  tests:
    android-jvm-unit:
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/repository_checks.py
            - test
