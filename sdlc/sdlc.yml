version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    java:
      executable: java
      version: "17"
    adb:
      executable: adb
  actions:
    validate:
      requires:
        capabilities:
          - uv
          - java
      result-schema: ceratops-repository-stage-result.v1
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/validate-repository.py
    test:
      requires:
        capabilities:
          - uv
          - java
      result-schema: ceratops-repository-stage-result.v1
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/run-tests.py
deliverables:
  packages:
    wobblepad-apk:
      source: app
      prerequisites: []
      artifact:
        type: android-apk
        output-directory: app/build/outputs/apk/debug
        filename-pattern: app-debug.apk
      actions:
        build:
          requires:
            capabilities:
              - uv
              - java
          result-schema: ceratops-build-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/build-android.py
  apps:
    wobblepad-android:
      source: app
      manifest: app/src/main/AndroidManifest.xml
      prerequisites:
        - wobblepad-apk
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Repository validation and tests cover the Android app source.
        install:
          requires:
            capabilities:
              - uv
              - adb
          parameters:
            - serial
          result-schema: ceratops-deployment-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/deploy-android.py
                - --serial
                - "{serial}"
